<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Ticket Booking System</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        details {
            width: 450px;
            margin: 15px auto;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        summary {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #1F3A5F;
            color: white;
            border-radius: 6px;
        }

        .content { padding: 20px; }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 9px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-book { background: #4A90E2; color: white; }
        .btn-update { background: #28A745; color: white; }
        .btn-delete { background: #DC3545; color: white; }
        .btn-view { background: #6C757D; color: white; }

        table {
            width: 85%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        th {
            background: #1F3A5F;
            color: white;
            padding: 10px;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:nth-child(even) { background: #f2f2f2; }

        .navbar {
            width: 100%;
            background-color: #1F3A5F;
            padding: 10px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 14px;
            background-color: #4A90E2;
            border-radius: 4px;
        }

        .navbar span { color: white; font-weight: bold; }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <a th:href="@{/ticket}">Home</a>
    <span sec:authentication="name"></span>
</div>

<h2>Ticket Booking System</h2>

<!-- USER: BOOK -->
<details sec:authorize="hasRole('USER')">
    <summary>Book Ticket</summary>
    <div class="content">
        <form th:action="@{/create}" th:object="${ticket}" method="post">
            <label>Passenger Name</label>
            <input type="text" th:field="*{passengername}" required>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Source Station</label>
            <input type="text" th:field="*{sourcestation}" required>

            <label>Destination Station</label>
            <input type="text" th:field="*{destinationstation}" required>

            <label>Phone Number</label>
            <input type="text" th:field="*{phonenumber}" required>

            <button class="btn-book">Book Ticket</button>
        </form>
    </div>
</details>

<!-- USER: UPDATE -->
<details sec:authorize="hasRole('USER')">
    <summary>Update Ticket</summary>
    <div class="content">
        <form th:action="@{/update}" th:object="${ticket}" method="post">
            <label>Ticket ID</label>
            <input type="text" th:field="*{ticketid}" required>

            <label>Passenger Name</label>
            <input type="text" th:field="*{passengername}" required>

            <label>Email</label>
            <input type="email" th:field="*{email}" required>

            <label>Source Station</label>
            <input type="text" th:field="*{sourcestation}" required>

            <label>Destination Station</label>
            <input type="text" th:field="*{destinationstation}" required>

            <label>Phone Number</label>
            <input type="text" th:field="*{phonenumber}" required>

            <button class="btn-update">Update Ticket</button>
        </form>
    </div>
</details>

<!-- ADMIN: DELETE -->
<details sec:authorize="hasRole('ADMIN')">
    <summary>Delete Ticket</summary>
    <div class="content">
        <form th:action="@{/delete}" method="post">
            <label>Ticket ID</label>
            <input type="text" name="ticketid" required>
            <button class="btn-delete">Delete Ticket</button>
        </form>
    </div>
</details>

<!-- ADMIN: VIEW BY ID -->
<details sec:authorize="hasRole('ADMIN')">
    <summary>View Ticket By ID</summary>
    <div class="content">
        <form th:action="@{/viewbyid}" method="get">
            <label>Ticket ID</label>
            <input type="text" name="ticketid" required>
            <button class="btn-view">View Ticket</button>
        </form>
    </div>
</details>

<!-- ADMIN: VIEW ALL -->
<details sec:authorize="hasRole('ADMIN')">
    <summary>View All Tickets</summary>
    <div class="content">
        <form th:action="@{/viewall}" method="get">
            <button class="btn-view">View All Tickets</button>
        </form>
    </div>
</details>

<!-- ADMIN TABLES -->
<table sec:authorize="hasRole('ADMIN')" th:if="${ticketById != null}">
    <thead>
        <tr>
            <th>Ticket ID</th>
            <th>Passenger Name</th>
            <th>Email</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Phone</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td th:text="${ticketById.ticketid}"></td>
            <td th:text="${ticketById.passengername}"></td>
            <td th:text="${ticketById.email}"></td>
            <td th:text="${ticketById.sourcestation}"></td>
            <td th:text="${ticketById.destinationstation}"></td>
            <td th:text="${ticketById.phonenumber}"></td>
        </tr>
    </tbody>
</table>

<table sec:authorize="hasRole('ADMIN')" th:if="${tickets != null}">
    <thead>
        <tr>
            <th>Ticket ID</th>
            <th>Passenger Name</th>
            <th>Email</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Phone</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="ticket : ${tickets}">
            <td th:text="${ticket.ticketid}"></td>
            <td th:text="${ticket.passengername}"></td>
            <td th:text="${ticket.email}"></td>
            <td th:text="${ticket.sourcestation}"></td>
            <td th:text="${ticket.destinationstation}"></td>
            <td th:text="${ticket.phonenumber}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
